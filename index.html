<style>
  :root{
    --bg:#FBFAF7; --ink:#0E0E10; --ink-faint:#6B6A63; --line:#E4E1D8;
    --pink:#FF3D8A; --purple:#7C3AED; --green:#22C55E;
    --font-h:"Archivo Black","Inter",sans-serif; --font-b:"Inter",-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--font-b); background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

  .shell-nav{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:12px 20px; border-bottom:2px solid var(--ink); flex:none;
  }
  .shell-brand{ font-family:var(--font-h); font-size:13px; margin-right:auto; letter-spacing:.3px; }
  .tab{
    font-family:var(--font-b); font-weight:700; font-size:12.5px; letter-spacing:.02em;
    background:#fff; border:1.5px solid var(--ink); border-radius:20px; padding:8px 16px;
    cursor:pointer; color:var(--ink); white-space:nowrap;
  }
  .tab:hover{ background:#F1F0EA; }
  .tab.active{ color:#fff; border-color:var(--tab-color, var(--ink)); background:var(--tab-color, var(--ink)); }

  .screens{ flex:1; position:relative; min-height:0; }
  .screen{ position:absolute; inset:0; display:none; }
  .screen.active{ display:block; }
  .screen iframe{ width:100%; height:100%; border:none; display:block; }

  @media (max-width:640px){
    .shell-nav{ padding:10px 14px; gap:6px; }
    .shell-brand{ width:100%; margin-bottom:2px; }
    .tab{ font-size:11.5px; padding:7px 12px; }
  }
</style>
